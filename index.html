<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <!-- Income -->
        <div>
            <h3>Income</h3>
            <p>
                ₹<span id="totalIncome">0</span>
            </p>
        </div>

        <!-- Expenses -->
        <div>
            <h3>Expenses</h3>
            <p>
                ₹<span id="totalExpenses">0</span>
            </p>
        </div>

        <!-- Balance -->
        <div>
            <h3>Balance</h3>
            <p>
                ₹<span id="totalBalance">0</span>
            </p>
        </div>

        <!-- Message -->
        <p id="message"></p>

    </div>


    <!-- Transaction Form -->
    <form id="form">

        <!-- Name -->
        <input
            type="text"
            id="name"
            placeholder="Name"
        >
        <br><br>


        <!-- Amount -->
        <input
            type="number"
            id="amount"
            placeholder="Amount"
        >
        <br><br>


        <!-- Transaction Type -->
        <select id="transactionType">

            <option value="income">
                Income
            </option>

            <option value="expense">
                Expense
            </option>

        </select>

        <br><br>


        <!-- Category -->
        <select id="transactionCategory">

            <option value="Salary">
                Salary
            </option>

            <option value="Groceries">
                Groceries
            </option>

            <option value="Utilities">
                Utilities
            </option>

        </select>

        <br><br>


        <!-- Submit Button -->
        <button type="submit">
            Add Transaction
        </button>

    </form>


    <!-- Transactions -->
    <div>

        <h2>Transactions</h2>

        <div id="list"></div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
